<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Intro</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import { createIntro } from './intro.js';
import { schedule, renderWavBase64 } from './sound.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const intro = await createIntro(canvas, { quality: q.get('q') || 'high', width: +q.get('w') || undefined, height: +q.get('h') || undefined, pixelRatio: +q.get('pr') || undefined });
window.intro = intro;
window.renderWavBase64 = renderWavBase64;

function play(withSound) {
  let ac = null, start = performance.now();
  if (withSound) { ac = new AudioContext(); start = ac.currentTime; schedule(ac, ac.destination, start + 0.1); }
  const loop = () => {
    const t = ac ? ac.currentTime - start - 0.1 : (performance.now() - start) / 1000;
    intro.render(Math.max(0, Math.min(t, intro.duration)));
    requestAnimationFrame(loop);
  };
  loop();
}

if (q.has('t')) {
  intro.render(+q.get('t'));
  window.__ready = true;
} else if (q.has('mute')) {
  play(false);
  window.__ready = true;
} else {
  const b = document.createElement('div');
  b.textContent = 'Click to play';
  b.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f2d9a8;font:20px system-ui;background:#000;cursor:pointer;z-index:2';
  document.body.appendChild(b);
  b.onclick = () => { b.remove(); play(true); };
  window.__ready = true;
}
</script></body></html>
