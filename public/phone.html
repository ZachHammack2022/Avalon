<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120d0a">
<title>Avalon</title>
<link rel="stylesheet" href="/phone/style.css">
</head>
<body>
<header id="top">
  <span id="roomtag"></span>
  <button id="peek" type="button" hidden aria-label="Hold to see your role"></button>
  <button id="helpbtn" type="button" aria-label="Help and how to play"></button>
</header>
<div id="offline" role="alert" hidden>Connection lost. Reconnecting… your seat is saved.</div>
<main id="main" aria-live="polite"><p class="muted center">Connecting…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Help"><div id="sheetbody"></div></div>
<div id="secret" hidden aria-live="polite"></div>
<script type="module" src="/phone/app.js"></script>
</body>
</html>
