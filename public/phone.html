<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Saboteur Quests</title>
<link rel="stylesheet" href="/phone/style.css">
</head>
<body>
<header id="top"><span id="roomtag"></span><span id="nametag"></span></header>
<div id="offline" role="alert" hidden>Connection lost. Reconnecting… your seat is saved.</div>
<main id="main" aria-live="polite"><p class="muted center">Connecting…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<footer id="peekbar" hidden>
  <button id="peek" type="button">Hold to peek at your role</button>
</footer>
<div id="secret" hidden aria-live="polite"></div>
<script type="module" src="/phone/app.js"></script>
</body>
</html>
